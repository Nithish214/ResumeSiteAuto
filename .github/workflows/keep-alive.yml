name: Keep MongoDB Atlas Awake

# Atlas pauses idle free-tier clusters. The Lambda opens a MongoDB connection
# on every request (see server/lambda.js), so a weekly ping counts as activity.
# -f makes curl fail on HTTP errors, so if the DB is down (Lambda returns 500)
# this workflow fails and GitHub emails you.

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday 09:00 UTC
  workflow_dispatch: # allows running it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          # VITE_API_URL ends in /api; the health route lives at the API root
          curl -fsS --retry 3 --retry-delay 10 "${VITE_API_URL%/api}/"
