name: Deploy Frontend to S3/CloudFront

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-frontend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Upload build to S3
        # Two passes so hashed and non-hashed files get different caching:
        #   - dist/assets/* has a content hash in its filename (Vite), so a
        #     given filename's contents never change - safe to cache for a
        #     year. A new deploy produces new filenames, it never reuses one.
        #   - Everything else (index.html, favicon.svg, resume PDFs) keeps
        #     the same filename across deploys, so it must always be
        #     revalidated or visitors' browsers could keep serving an old
        #     index.html that references assets which no longer exist.
        # Without any Cache-Control, browsers fall back to heuristic caching
        # and re-fetch on most visits anyway - this makes repeat visits
        # actually use the disk cache instead of re-downloading everything.
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "assets/*"

          aws s3 sync dist/ s3://${{ vars.S3_BUCKET_NAME }} --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "assets/*"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"