<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nithish Kumar - Cloud Operations Engineer & SRE-Focused Software Engineer. Resume, experience, projects and contact."
    />
    <title>Nithish Kumar | Cloud Operations & SRE Engineer</title>

    <!--
      Fonts: Sora (display), Inter (body), JetBrains Mono (data/labels) -
      self-hosted from public/fonts/ (see src/index.css for the @font-face
      rules) instead of fonts.googleapis.com, which used to block first
      paint on two extra cross-origin round trips before any text could
      render. Preloading the two used above the fold (headline + body text)
      gets them requested immediately instead of waiting on CSS parsing to
      discover them.
    -->
    <link rel="preload" href="/fonts/Sora-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Inline script: applies the saved theme (or system preference) BEFORE
      React mounts, so the page never "flashes" the wrong theme on load.
      See src/context/ThemeContext.jsx for the rest of the theme logic.
    -->
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        var prefersDark =
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved || (prefersDark ? "dark" : "light");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
